[project]
name = "almasim"
version = "2.1.16"
description = "An ALMA Simulation package for a more civilized era."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Michele Delli Veneri", email = "micheledelliveneri@gmail.com"},
]
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy",
    "httpx",
    "pyvo",
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
    "scipy",
    "h5py",
    "kaggle",
    "kagglehub",
    "dask",
    "dask-jobqueue",
    "distributed",
    # parallel: numba threads the TNG insertion; tngsource: Hdecompose for TNG particles
    "astromartini[parallel,tngsource]>=3,<4",
    "paramiko",
    "pysftp",
    "tenacity",
    "nifty8",
    "scikit-image",
    "imagecodecs",  # not imported directly: image decoding for the dataset sky models
    "ducc0",
    "typer",
    "pypdf>=6.19.0",
    # The noise model files' schema (services.noise_model).
    "pydantic>=2",
]

[project.scripts]
almasim = "almasim.cli:main"

[project.optional-dependencies]
# The Dask dashboard the CLI links to (distributed serves it only with bokeh).
dashboard = ["bokeh>=3.9.0"]
casa = ["casatools", "casatasks"]
ms-casacore = ["python-casacore"]
# The web console: `almasim serve` (web console plan, S2.1).
web = ["fastapi", "uvicorn[standard]"]

[project.urls]
Repository = "https://github.com/astromadiv/ALMASim"
Homepage = "https://github.com/astromadiv/ALMASim"
Documentation = "https://astromadiv.github.io/ALMASim/"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy>=2.1.0",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "ipykernel>=7.2.0",
    "marimo[lsp]>=0.10",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "myst-parser>=5.1.0",
    "sphinx-copybutton>=0.5.2",
]
test = [
    "pytest",
    "pytest-cov",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/almasim"]

# The built web app goes into both distributions (hatch_build.py, S2.6).
[tool.hatch.build.targets.wheel.hooks.custom]
[tool.hatch.build.targets.sdist.hooks.custom]

[tool.ruff]
line-length = 100
exclude = ["node_modules", ".venv", "build", "htmlcov", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "RUF100", "C901"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with a call in the default (so does Typer; see
# the per-file ignores).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]
"examples/ImagingWithDucc0.py" = ["ALL"]
# Typer declares options with typer.Option(...) in the default, and some
# defaults (the output folders) are computed when the command is defined.
"src/almasim/cli/*.py" = ["B008"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src/almasim"]
mypy_path = ["src"]
explicit_package_bases = true
ignore_missing_imports = true

# Baseline (MADIV-28 T0.1): these modules had type errors when mypy was first
# enabled in CI. Remove a module from this list once its errors are fixed.
[[tool.mypy.overrides]]
module = [
    "almasim.cli",
    "almasim.cli.image",
    "almasim.cli.simulation",
    "almasim.scheduling.cluster",
    "almasim.services.archive.qa0",
    "almasim.services.astro.spectral",
    "almasim.services.compute.dask",
    "almasim.services.compute.factory",
    "almasim.services.compute.kubernetes",
    "almasim.services.external_skymodel",
    "almasim.services.imaging.selfcal.loop",  # moved out of archive_imaging
    "almasim.services.imaging.task",  # moved out of archive_imaging
    "almasim.services.imaging.ms.chunks",  # moved out of archive_imaging
    "almasim.services.interferometry.core",
    "almasim.services.interferometry.imaging",
    "almasim.services.interferometry.utils",
    "almasim.skymodels.datasets.tng",
    "almasim.skymodels.serendipitous",
]
ignore_errors = true

[tool.uv]
package = true

