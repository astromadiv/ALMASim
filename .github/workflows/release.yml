name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  actions: read

jobs:

  # ------------------------------------------------------------------
  # 1. Validate that the pushed tag matches the version in pyproject.toml
  # ------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Assert tag matches pyproject.toml
        run: |
          PKG=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "ERROR: tag $TAG does not match pyproject.toml version $PKG"
            exit 1
          fi

  # ------------------------------------------------------------------
  # 2. Run the full lint + test suite (reuses the existing workflow)
  # ------------------------------------------------------------------
  tests:
    needs: validate
    uses: ./.github/workflows/lint_and_test.yml
    secrets: inherit

  # ------------------------------------------------------------------
  # 3. Build wheel + sdist once, with the web app inside (hatch_build.py;
  #    ALMASIM_REQUIRE_WEB makes a missing app an error)
  # ------------------------------------------------------------------
  dist:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the web app
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build distributions
        run: uv build
        env:
          ALMASIM_REQUIRE_WEB: "1"

      - name: The wheel holds the app
        run: python scripts/check_web_wheel.py dist/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ------------------------------------------------------------------
  # 4. Publish to PyPI via OIDC trusted publisher
  #    Setup required once on PyPI:
  #    https://docs.pypi.org/trusted-publishers/adding-a-publisher/
  #    Owner: astromadiv  Repo: ALMASim
  #    Workflow: release.yml  Environment: pypi
  # ------------------------------------------------------------------
  publish-pypi:
    needs: dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/almasim/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ------------------------------------------------------------------
  # 5. Create a GitHub Release and attach the same distributions
  # ------------------------------------------------------------------
  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*

  # ------------------------------------------------------------------
  # 6. Build and push the console Docker image to GHCR (docker compose)
  # ------------------------------------------------------------------
  docker:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/almasim-console
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.console
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console

  # ------------------------------------------------------------------
  # 7. Build and push frontend Docker image to GHCR
  # ------------------------------------------------------------------
  docker-frontend:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/almasim-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
