name: CI image

# Builds the container used by the pipeline regression jobs (casacore 3.8.0,
# WSClean at the zwicky commit, casatools/casatasks/python-casacore from
# uv.lock, CASA runtime data). It is tagged with a hash of its inputs
# (ci/image-tag.sh), so it is rebuilt only when those inputs change.

on:
  push:
    branches: [main]
    paths:
      - ci/image/**
      - ci/image-tag.sh
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci-image.yml
  pull_request:
    paths:
      - ci/image/**
      - ci/image-tag.sh
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci-image.yml
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: Full reference of the CI image for this commit.
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag
        id: tag
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/almasim-ci:$(ci/image-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the image already exists
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ci/image/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          load: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=almasim-ci
          cache-to: type=gha,scope=almasim-ci,mode=max

      - name: Smoke test
        run: |
          docker run --rm "${{ steps.tag.outputs.image }}" bash -o pipefail -c '
            wsclean --version | head -2 &&
            python -c "import casatools, casatasks, casacore.tables, ducc0; print(\"casatools\", casatools.version_string())" &&
            ls /opt/casa-data | head'
